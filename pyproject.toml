[project]
name = "langchainagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MeeLeea", email = "MeeLeea@github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.10,<4.0",
    "fastapi>=0.110,<1.0.0",
    "fastmcp>=2.0.0,<3.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-mcp-adapters>=0.3.0,<1.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint>=4.0.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
    "langgraph-prebuilt>=1.0.0,<2.0.0",
    "lark-oapi>=1.7,<2.0",
    "mcp>=1.9.0,<2.0.0",
    "openai>=1.0.0,<3.0.0",
    "pillow>=12.3.0",
    "pyautogui>=0.9,<1.0",
    "pytest>=7.0,<9.0",
    "pywin32>=312 ; sys_platform == 'win32'",
    "tavily-python>=0.5.0,<1.0.0",
    "tenacity>=9.0,<10.0",
    "uvicorn[standard]>=0.29,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",
]

# ⚠️删掉 [project.scripts]！
# 因为 --no-install‑project 模式，scripts不会注册。
# 启动只能 uv run python main.py

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "node_modules",
    "dist",
    "build",
    "*.pyc",
]
# 不显式 select：沿用 ruff 0.16 默认规则集（已通过 ruff>=0.16,<0.17 锁版本保证可复现）
# 中文注释/标点多的项目，开启全量规则会产生大量噪音，故维持默认即可

[tool.ruff.lint]
# 有意宽异常捕获：agent 工具层/API 边界/调度作业需捕获一切异常转成错误信息
# 返回给 LLM/用户或记入日志，收窄会导致错误处理退化，故全项目忽略 BLE001
ignore = ["BLE001"]

